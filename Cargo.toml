[package]
name = "mac-clamshell-mcp"
version = "1.5.2"
edition = "2021"
description = "Native macOS clamshell performance throttling, display thermal guard, built-in brightness control, and MCP dashboard"
license = "MIT"
repository = "https://github.com/eatingDream-antigravity-plugins/clam-guard"
keywords = ["macos", "apple-silicon", "clamshell", "brightness", "mcp"]
categories = ["command-line-utilities", "os::macos-apis"]

[[bin]]
name = "mac-clamshell-mcp"
path = "src/main.rs"

[features]
test-mocks = []

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
